name: Test

# Nothing ran these automatically until now. The regression suite here is made
# entirely of bugs that reached real users — a cleaner shown the client home
# screen, an account locked out by a typo, an event landing on the wrong day —
# and it was protected only by remembering to type `npm test`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      # A local check only: it proves nobody edited a shared file here without
      # rewriting the manifest. It CANNOT prove the two products agree — this
      # repo cannot read the website's private one.
      #
      # The real cross-product comparison runs in the website's CI, which can
      # fetch this repo's manifest because this repo is public. If a shared file
      # changes here, that job is what fails. Do not mistake a green tick on
      # this step for the two products being in step.
      - name: Shared files match this repo's manifest
        run: node scripts/shared-hash.mjs

      - name: Regression tests
        run: npm test

      - name: Types
        run: npx tsc --noEmit

      # Not a gate. The baseline is 282 problems, 64 of them errors, all
      # predating this workflow — failing the build on day one would teach
      # everyone to ignore it. It runs so the number is visible and so a
      # deliberate cleanup has somewhere to show up.
      - name: Lint (informational)
        run: npm run lint
        continue-on-error: true
