name: Build Android APK

# הפעלה ידנית בלבד.
#
# קודם היה כאן גם `push: branches: [main]`, כלומר כל דחיפה ל-main פתחה בילד
# של רבע שעה. בפועל זה גם קידם את מספר הבילד בלי קשר לגרסה: דחיפה, דחיפה,
# והפעלה ידנית פתחו שלוש ריצות במקביל, ומה שהיה אמור להיות 187 יצא 190.
#
# APK נוצר כשמבקשים אותו:  gh workflow run build-android.yml --ref main
on:
  workflow_dispatch:

# בונה APK עצמאי (release), לא dev client.
#
# הוורקפלואו הזה בנה קודם `assembleDebug` עם expo-dev-client. בנייה כזו אינה
# מכילה את קוד ה-JavaScript של האפליקציה בכלל — היא קליפה נייטיב שמושכת אותו
# משרת Metro בזמן ריצה. כל שינוי ב-TypeScript פשוט לא היה נמצא בקובץ, ושני
# APK-ים מקומיטים שונים יצאו זהים לחלוטין מבחינת תוכן. `assembleRelease` מטמיע
# את ה-bundle, ולכן ה-APK באמת מכיל את הקוד של הקומיט שממנו נבנה.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      # מזהה בנייה שאפשר לראות מהטלפון: הגדרות → אפליקציות → A&M Clean מציג
      # את versionName, ולכן הקומיט נכנס לתוכו. בלי זה כל הבניות מדווחות אותה
      # גרסה ואי אפשר לדעת מה מותקן.
      # versionCode עולה בכל ריצה, אחרת אנדרואיד מסרב להתקין בנייה חדשה על
      # ישנה עם אותו מספר.
      - name: Stamp the commit into the app version
        run: |
          node -e "
            const fs = require('fs');
            const sha = process.env.GITHUB_SHA.slice(0, 7);
            const j = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            j.expo.version = j.expo.version + '+' + sha;
            j.expo.android.versionCode = 1000 + Number(process.env.GITHUB_RUN_NUMBER);
            fs.writeFileSync('app.json', JSON.stringify(j, null, 2));
            console.log('version', j.expo.version, 'versionCode', j.expo.android.versionCode);
          "

      # בלי FCM אין טוקן פוש, ובלי טוקן אין התראות. EAS Build הזריק את
      # google-services.json מההרשאות ששמורות אצל Expo; בנייה מקומית על שרת
      # GitHub לא רואה אותן, ולכן הקובץ חייב להגיע לכאן כסוד של הריפו.
      #
      # אם הסוד לא הוגדר, הבנייה ממשיכה בדיוק כמו קודם ומדפיסה אזהרה — כדי
      # שהיעדר הפוש יהיה גלוי בלוג במקום להתגלות על מכשיר.
      - name: Wire FCM when the credential is available
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
            node -e "
              const fs = require('fs');
              const j = JSON.parse(fs.readFileSync('app.json', 'utf8'));
              j.expo.android = j.expo.android || {};
              j.expo.android.googleServicesFile = './google-services.json';
              fs.writeFileSync('app.json', JSON.stringify(j, null, 2));
              console.log('FCM wired — push notifications will work in this build');
            "
          else
            echo "::warning::GOOGLE_SERVICES_JSON is not set. This APK will have no FCM, so push notifications will not work in it."
          fi

      - name: Prebuild Android (generate native code)
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_GIT_STATUS: 1

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"

      # תבנית ה-release של Expo/RN מכוונת לחתימת ה-debug, ו-gradle מוציא
      # app-release.apk חתום. אם התבנית תשתנה ותשאיר קובץ לא חתום — עוצרים.
      #
      # קודם עמד כאן גיבוי שחתם ב-keystore שיוצר כאן בריצה ונשמר בקאש, "כדי
      # שה-SHA-1 יישאר זהה". זה לא היה נכון: נמדד בבילד 190 ש-gradle חותם
      # במפתח אחר לגמרי (‎5E:8F:16:…‎), ולא בזה (‎5D:F7:F2:…‎). כלומר אילו
      # הגיבוי היה נכנס לפעולה, ה-APK היה יוצא חתום במפתח שונה מכל הבילדים
      # שלפניו — לא מתקין מעל גרסה קיימת ("signatures do not match"), ו-Google
      # Sign-In שבור, בלי ששום דבר בלוג יצביע לכאן.
      #
      # כישלון רועש עדיף על APK שנראה תקין ולא ניתן להתקנה. חתימה במפתח קבוע
      # ומפורש (secret) היא הפתרון האמיתי כשיגיע הרגע לפרסם בחנות.
      - name: Fail if gradle left the APK unsigned
        run: |
          set -e
          cd android/app/build/outputs/apk/release
          ls -la
          if [ ! -f app-release.apk ]; then
            echo "::error::gradle produced no signed app-release.apk. Signing it here would use a different key than every previous build, so the APK would refuse to install over an existing one. Add an explicit signing keystore as a repo secret instead."
            exit 1
          fi

      # השומר החשוב. בלעדיו הוורקפלואו יכול לחזור בשקט לייצר קליפה בלי קוד,
      # וזה נראה כמו הצלחה מלאה עד שמתקינים ומגלים שהאפליקציה מחפשת Metro.
      - name: Verify the APK actually contains the app's JavaScript
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::No app-release.apk was produced"; exit 1; }
          if ! unzip -l "$APK" | grep -qE 'assets/index\.android\.bundle'; then
            echo "::error::index.android.bundle is missing — this APK is a shell that loads JS from Metro, not a standalone build."
            unzip -l "$APK" | grep '^.*assets/' | head -20
            exit 1
          fi
          echo "OK — the JS bundle is embedded"

      # הטביעה שנרשמת ב-Firebase חייבת להיות זו שה-APK באמת חתום בה.
      #
      # קודם הודפס כאן ה-SHA-1 של ~/.android/debug.keystore. זה ה-keystore
      # שאנחנו יוצרים ושומרים בקאש, אבל gradle חותם לפי signingConfig שתבנית
      # expo prebuild מייצרת — והיא מצביעה על android/app/debug.keystore, קובץ
      # שנוצר מחדש בכל prebuild. כלומר ההדפסה תיארה מפתח שייתכן שכלל לא שימש
      # לחתימה, ורישום שלו ב-Firebase שובר את Google Sign-In בלי שום הודעת
      # שגיאה שמצביעה לכאן.
      #
      # apksigner קורא את התעודה מתוך ה-APK הבנוי. זו האמת היחידה שיש, ולא
      # משנה איזה keystore gradle בחר בסוף.
      - name: Print the SHA-1 the APK is actually signed with
        run: |
          set -e
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1) || {
            echo "::error::No Android build-tools found under ANDROID_SDK_ROOT ($ANDROID_SDK_ROOT)."; exit 1; }

          # ‎`|| { ... }`‎ ולא השמה חשופה: apksigner יוצא בקוד שאינו אפס כשה-APK
          # אינו מאומת, ועם set -e ההשמה עצמה הורגת את השלב — כלומר הבדיקה
          # הידידותית שמתחתיה לא הייתה רצה אף פעם במקרה שבשבילו נכתבה, והלוג
          # היה מראה יציאה שקטה בלי שום הסבר.
          CERTS=$("$BT/apksigner" verify --print-certs "$APK") || {
            echo "::error::apksigner could not verify $APK. The APK is unsigned or its signature is broken; it will not install."; exit 1; }

          echo "$CERTS" | grep -E 'SHA-1|SHA-256' || true
          SHA1=$(echo "$CERTS" | grep -m1 'SHA-1 digest' | awk '{print $NF}') || true
          if [ -z "$SHA1" ]; then
            echo "::error::apksigner verified the APK but printed no SHA-1. Google Sign-In cannot be configured without it."
            exit 1
          fi
          # בפורמט שמדביקים ל-Firebase Console (זוגות מופרדים בנקודתיים).
          FMT=$(echo "$SHA1" | tr 'a-z' 'A-Z' | sed 's/../&:/g; s/:$//')
          echo "APK signing SHA-1 (register this one in Firebase): $FMT"
          echo "::notice title=APK signing SHA-1::$FMT"

          # המפתח חייב להישאר זה שכל הבילדים הקודמים חתומים בו, אחרת אי אפשר
          # להתקין מעל גרסה מותקנת. הערך יושב במשתנה ריפו ולא כאן, כדי
          # שהחלפת מפתח מכוונת — בדיוק מה שצריך לקרות לפני פרסום בחנות — תהיה
          # שינוי בהגדרות ולא עריכת וורקפלואו שנכשלת רבע שעה לתוך הריצה.
          #
          # ‎5E:8F:16:…‎ הוא ה-keystore של תבנית expo-template-bare-minimum,
          # שנשלחת ב-npm עם הסיסמה android. הוא יציב, ולכן השדרוג-במקום עובד —
          # אבל הוא ציבורי, וכל אחד יכול לחתום בו APK שיתקין מעל האמיתי.
          # ההחלפה ב-keystore פרטי היא הצעד הבא, ואז מעדכנים את המשתנה.
          EXPECTED="${{ vars.EXPECTED_SIGNING_SHA1 }}"
          if [ -z "$EXPECTED" ]; then
            echo "::warning::Repository variable EXPECTED_SIGNING_SHA1 is not set, so the signing key is not being checked. Set it to $FMT to pin the current key."
          elif [ "$FMT" != "$EXPECTED" ]; then
            echo "::error::This APK is signed with $FMT, but EXPECTED_SIGNING_SHA1 is $EXPECTED. If the key changed by accident this build will not install over an existing copy — do not distribute it. If you changed it deliberately, update the EXPECTED_SIGNING_SHA1 repository variable and re-register the fingerprint in Firebase."
            exit 1
          else
            echo "Signing key unchanged from previous builds."
          fi

      - name: Name the APK after the commit
        id: apk
        run: |
          SHA=$(git rev-parse --short HEAD)
          NAME="AM-Clean-${SHA}-build${GITHUB_RUN_NUMBER}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 30
