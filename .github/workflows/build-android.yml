name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:   # אפשר גם הפעלה ידנית

# בונה APK עצמאי (release), לא dev client.
#
# הוורקפלואו הזה בנה קודם `assembleDebug` עם expo-dev-client. בנייה כזו אינה
# מכילה את קוד ה-JavaScript של האפליקציה בכלל — היא קליפה נייטיב שמושכת אותו
# משרת Metro בזמן ריצה. כל שינוי ב-TypeScript פשוט לא היה נמצא בקובץ, ושני
# APK-ים מקומיטים שונים יצאו זהים לחלוטין מבחינת תוכן. `assembleRelease` מטמיע
# את ה-bundle, ולכן ה-APK באמת מכיל את הקוד של הקומיט שממנו נבנה.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      # מזהה בנייה שאפשר לראות מהטלפון: הגדרות → אפליקציות → A&M Clean מציג
      # את versionName, ולכן הקומיט נכנס לתוכו. בלי זה כל הבניות מדווחות אותה
      # גרסה ואי אפשר לדעת מה מותקן.
      # versionCode עולה בכל ריצה, אחרת אנדרואיד מסרב להתקין בנייה חדשה על
      # ישנה עם אותו מספר.
      - name: Stamp the commit into the app version
        run: |
          node -e "
            const fs = require('fs');
            const sha = process.env.GITHUB_SHA.slice(0, 7);
            const j = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            j.expo.version = j.expo.version + '+' + sha;
            j.expo.android.versionCode = 1000 + Number(process.env.GITHUB_RUN_NUMBER);
            fs.writeFileSync('app.json', JSON.stringify(j, null, 2));
            console.log('version', j.expo.version, 'versionCode', j.expo.android.versionCode);
          "

      - name: Cache Android debug keystore (keeps SHA-1 stable)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Generate debug keystore if not cached
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Keystore generated"
          else
            echo "Keystore restored from cache"
          fi

      # בלי FCM אין טוקן פוש, ובלי טוקן אין התראות. EAS Build הזריק את
      # google-services.json מההרשאות ששמורות אצל Expo; בנייה מקומית על שרת
      # GitHub לא רואה אותן, ולכן הקובץ חייב להגיע לכאן כסוד של הריפו.
      #
      # אם הסוד לא הוגדר, הבנייה ממשיכה בדיוק כמו קודם ומדפיסה אזהרה — כדי
      # שהיעדר הפוש יהיה גלוי בלוג במקום להתגלות על מכשיר.
      - name: Wire FCM when the credential is available
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
            node -e "
              const fs = require('fs');
              const j = JSON.parse(fs.readFileSync('app.json', 'utf8'));
              j.expo.android = j.expo.android || {};
              j.expo.android.googleServicesFile = './google-services.json';
              fs.writeFileSync('app.json', JSON.stringify(j, null, 2));
              console.log('FCM wired — push notifications will work in this build');
            "
          else
            echo "::warning::GOOGLE_SERVICES_JSON is not set. This APK will have no FCM, so push notifications will not work in it."
          fi

      - name: Prebuild Android (generate native code)
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_GIT_STATUS: 1

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"

      # תבנית ה-release של Expo/RN מכוונת לחתימת ה-debug, ואז gradle מוציא
      # app-release.apk חתום. אם התבנית תשתנה ותשאיר קובץ לא חתום, הוא לא ניתן
      # להתקנה — אז חותמים כאן באותו keystore, כדי שה-SHA-1 יישאר זהה.
      - name: Sign the APK if gradle left it unsigned
        run: |
          set -e
          cd android/app/build/outputs/apk/release
          ls -la
          if [ ! -f app-release.apk ] && [ -f app-release-unsigned.apk ]; then
            BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
            "$BT/apksigner" sign \
              --ks ~/.android/debug.keystore \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android --key-pass pass:android \
              --out app-release.apk app-release-unsigned.apk
            echo "Signed with the debug keystore"
          fi

      # השומר החשוב. בלעדיו הוורקפלואו יכול לחזור בשקט לייצר קליפה בלי קוד,
      # וזה נראה כמו הצלחה מלאה עד שמתקינים ומגלים שהאפליקציה מחפשת Metro.
      - name: Verify the APK actually contains the app's JavaScript
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::No app-release.apk was produced"; exit 1; }
          if ! unzip -l "$APK" | grep -qE 'assets/index\.android\.bundle'; then
            echo "::error::index.android.bundle is missing — this APK is a shell that loads JS from Metro, not a standalone build."
            unzip -l "$APK" | grep '^.*assets/' | head -20
            exit 1
          fi
          echo "OK — the JS bundle is embedded"

      # הטביעה שנרשמת ב-Firebase חייבת להיות זו שה-APK באמת חתום בה.
      #
      # קודם הודפס כאן ה-SHA-1 של ~/.android/debug.keystore. זה ה-keystore
      # שאנחנו יוצרים ושומרים בקאש, אבל gradle חותם לפי signingConfig שתבנית
      # expo prebuild מייצרת — והיא מצביעה על android/app/debug.keystore, קובץ
      # שנוצר מחדש בכל prebuild. כלומר ההדפסה תיארה מפתח שייתכן שכלל לא שימש
      # לחתימה, ורישום שלו ב-Firebase שובר את Google Sign-In בלי שום הודעת
      # שגיאה שמצביעה לכאן.
      #
      # apksigner קורא את התעודה מתוך ה-APK הבנוי. זו האמת היחידה שיש, ולא
      # משנה איזה keystore gradle בחר בסוף.
      - name: Print the SHA-1 the APK is actually signed with
        run: |
          set -e
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          CERTS=$("$BT/apksigner" verify --print-certs "$APK")
          echo "$CERTS" | grep -E 'SHA-1|SHA-256' || true
          SHA1=$(echo "$CERTS" | grep -m1 'SHA-1 digest' | awk '{print $NF}')
          if [ -z "$SHA1" ]; then
            echo "::error::Could not read a SHA-1 out of the APK. Google Sign-In cannot be configured without it."
            exit 1
          fi
          # בפורמט שמדביקים ל-Firebase Console (זוגות מופרדים בנקודתיים).
          FMT=$(echo "$SHA1" | tr 'a-z' 'A-Z' | sed 's/../&:/g; s/:$//')
          echo "APK signing SHA-1 (register this one in Firebase): $FMT"
          echo "::notice title=APK signing SHA-1::$FMT"

          # אם זו עדיין חתימת ה-debug keystore שלנו, שתיהן יסכימו. כשהן לא —
          # התבנית חתמה במפתח אחר, וזה בדיוק המקרה שההדפסה הישנה החביאה.
          KS=$(keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey \
                 -storepass android -keypass android 2>/dev/null \
               | grep -m1 'SHA1:' | awk '{print $NF}')
          if [ -n "$KS" ] && [ "$KS" != "$FMT" ]; then
            echo "::warning::The cached debug keystore ($KS) is NOT what signed this APK ($FMT). Register the APK's fingerprint, not the keystore's."
          fi

      - name: Name the APK after the commit
        id: apk
        run: |
          SHA=$(git rev-parse --short HEAD)
          NAME="AM-Clean-${SHA}-build${GITHUB_RUN_NUMBER}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 30
