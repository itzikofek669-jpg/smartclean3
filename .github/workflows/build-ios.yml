name: Build iOS

# Until now nothing built iOS anywhere. That is how the react-native-maps
# podspec break (see plugins/withGoogleMapsPodspecFix.js) sat unnoticed — it
# only surfaces at `pod install`, which no CI ran. This job compiles for the
# simulator so a packaging break fails here instead of at App Store submission.
#
# No signing: a simulator build needs no certificates or provisioning profiles,
# so this stays useful without any secrets in the repo.

on:
  push:
    branches: [main]
  workflow_dispatch:   # אפשר גם הפעלה ידנית

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90

    env:
      # CocoaPods aborts with "Unicode Normalization not appropriate for
      # ASCII-8BIT" unless the locale is UTF-8.
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # `npm ci`, not `npm install` — the same reason the Android workflow
        # gives: install re-resolves transitives and rewrites the lockfile, so
        # this job compiled a dependency tree no test job had ever run against.
        # On this project a dependency change has broken a build before.
        run: npm ci

      - name: Prebuild iOS (generate native project)
        run: npx expo prebuild --platform ios --no-install
        env:
          EXPO_NO_GIT_STATUS: 1

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
            ~/Library/Caches/ReactNative
          key: pods-${{ hashFiles('ios/Podfile.lock', 'package-lock.json') }}
          restore-keys: pods-

      - name: Pod install
        run: cd ios && pod install

      - name: Confirm the Google Maps subspec was used
        run: |
          if grep -q "pod 'react-native-google-maps'" ios/Podfile; then
            echo "::error::Podfile still names react-native-google-maps — withGoogleMapsPodspecFix did not run"
            exit 1
          fi
          grep -q "pod 'react-native-maps/Google'" ios/Podfile \
            && echo "OK: Podfile uses the react-native-maps/Google subspec"

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/AMClean.xcworkspace \
            -scheme AMClean \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-ios \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | { command -v xcpretty >/dev/null && xcpretty || cat; }

      - name: Check the JS bundle was embedded
        run: |
          APP=$(find build-ios/Build/Products/Release-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP"
          ls -la "$APP/main.jsbundle"

      # A simulator slice cannot be installed on a physical iPhone — different
      # architecture — so the check above proves the project compiles and
      # nothing more. This one builds the arm64 device binary, which is what a
      # real install actually needs, and would have caught the fact that the
      # iOS side had never been compiled for a device at all.
      #
      # Still unsigned: signing needs an Apple ID, and a free one is enough to
      # install on your own iPhone from Xcode. CODE_SIGNING_ALLOWED=NO stops
      # this job needing any credentials while still compiling every line.
      - name: Compile for a real device (arm64, unsigned)
        run: |
          # pipefail, not just -e. GitHub's default shell is `bash -e {0}` with
          # NO pipefail, so `xcodebuild ... | tail -5` threw away the compiler's
          # exit status entirely — a failed build carried on to the next line and
          # reported "No device .app was produced", having already discarded the
          # actual error. The simulator step above sets pipefail; this one did not.
          set -eo pipefail
          cd ios
          xcodebuild \
            -workspace AMClean.xcworkspace \
            -scheme AMClean \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../build-ios-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build | tail -5
          APP=$(find ../build-ios-device/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP" || { echo "::error::No device .app was produced"; exit 1; }

          # LC_BUILD_VERSION platform: 2 is iOS, 7 is the simulator. `lipo -info`
          # cannot tell them apart — an arm64 SIMULATOR slice prints exactly the
          # same "Non-fat file: ... arm64" — so the previous check proved nothing
          # about the thing it was named for. It was also dead code: under `set -e`
          # a non-matching `grep -o` killed the step one line earlier with no
          # message, and `arm64 arm64e` would have failed it for no reason.
          BIN="$APP/$(basename "$APP" .app)"
          PLATFORM=$(otool -l "$BIN" | awk '/LC_BUILD_VERSION/{f=1} f&&/platform/{print $2; exit}')
          test "$PLATFORM" = "2" || { echo "::error::Built for platform $PLATFORM, not iOS device (2). This cannot run on an iPhone."; exit 1; }

          test -f "$APP/main.jsbundle" || { echo "::error::main.jsbundle is missing — the app would have no JavaScript"; exit 1; }
          echo "OK — iOS device build (platform 2) with an embedded JS bundle"

      # The device build was verified and then discarded — only the simulator app
      # was uploaded, so nobody could retrieve the one that matters.
      - name: Upload the device build
        uses: actions/upload-artifact@v4
        with:
          name: AMClean-iOS-device-unsigned
          path: build-ios-device/Build/Products/Release-iphoneos/*.app
          if-no-files-found: error

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: AMClean-iOS-Simulator
          path: build-ios/Build/Products/Release-iphonesimulator/*.app
          retention-days: 30
